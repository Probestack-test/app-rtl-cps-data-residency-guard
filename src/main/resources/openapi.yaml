openapi: 3.0.3
info:
  contact:
    email: data-sovereignty@forgesphere.example.com
    name: ForgeSphere Data Sovereignty Team
  description: "Data sovereignty and cross-border transfer enforcement for the ForgeSphere\
    \ \nplatform. Ensures every byte of customer data stays within its legally \n\
    mandated geographic boundary. Blocks unauthorized cross-region movement, \nenforces\
    \ GDPR/Schrems II/DPDP/HIPAA/PIPL data residency rules, and generates \naudit-grade\
    \ compliance evidence for regulators and enterprise customers.\n"
  title: Data Residency Guard
  version: 1.0.0
servers:
- description: Production Server
  url: https://residency.forgesphere.lightning.com/v1
- description: Local Development Server
  url: http://localhost:8124/v1
security:
- bearerAuth: []
tags:
- description: "Define, enforce, and audit data residency policies."
  name: Residency
paths:
  /policies:
    post:
      description: "Registers a residency policy that binds a data classification\
        \ + \nregulatory framework to a set of allowed regions. Once active, any \n\
        attempt to move that data outside the allowed regions is blocked \nat the\
        \ enforcement point (sidecar, gateway, or storage layer).\n"
      operationId: defineResidencyPolicy
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/defineResidencyPolicy_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyPolicy"
          description: Residency policy registered.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid payload, missing fields, or conflicting regions."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: A policy with this name already exists.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Enforcement sidecar or evidence engine unavailable.
      summary: Define a new data residency policy
      tags:
      - Residency
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Residency
  /check:
    post:
      description: "The critical enforcement endpoint — called synchronously before\
        \ any \ncross-region data operation (replication, backup, cache population,\
        \ \nanalytics export, ML training, CDN push). Returns ALLOW / BLOCK / \nAUTO_ROUTE\
        \ with the governing policy and legal basis. Latency <20ms \nwith local caching.\n"
      operationId: checkDataMovement
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/checkDataMovement_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MovementDecision"
          description: Movement decision with legal basis.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid payload, missing fields, or conflicting regions."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Enforcement sidecar or evidence engine unavailable.
      summary: Check if a proposed data movement is allowed
      tags:
      - Residency
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Residency
  /map:
    get:
      description: "Returns a geographic view of all data storage and processing locations,\
        \ \ngrouped by region. Includes compliance status per region, active \npolicies,\
        \ data volumes, and any residency violations in progress. \nPowers the \"\
        data sovereignty dashboard\" for legal & security teams.\n"
      operationId: getResidencyMap
      parameters:
      - example: PII
        explode: true
        in: query
        name: dataClassification
        required: false
        schema:
          enum:
          - PII
          - PHI
          - PCI
          - FINANCIAL
          - CUSTOMER_CONTENT
          - AUTHENTICATION
          - TELEMETRY
          - PUBLIC
          - INTERNAL
          type: string
        style: form
      - example: true
        explode: true
        in: query
        name: includeViolations
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - example: GDPR
        explode: true
        in: query
        name: framework
        required: false
        schema:
          enum:
          - GDPR
          - SCHREMS_II
          - DPDP_INDIA
          - HIPAA
          - PIPL_CHINA
          - LGPD_BRAZIL
          - PIPEDA_CANADA
          - APPI_JAPAN
          - POPIA_SOUTH_AFRICA
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyMap"
          description: Geographic residency map with compliance status.
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Enforcement sidecar or evidence engine unavailable.
      summary: Get a live map of where data resides across the platform
      tags:
      - Residency
      x-accepts: application/json
      x-tags:
      - tag: Residency
  /audit/evidence:
    post:
      description: "Produces a signed, tamper-proof report proving data residency\
        \ \ncompliance for a given framework and period. Accepted by regulators, \n\
        enterprise auditors, and customers performing due diligence. \nAutomatically\
        \ cross-referenced with Compliance Evidence Vault.\n"
      operationId: generateAuditEvidence
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/generateAuditEvidence_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResidencyEvidence"
          description: Evidence generation queued.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Invalid payload, missing fields, or conflicting regions."
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Enforcement sidecar or evidence engine unavailable.
      summary: Generate audit-grade residency compliance evidence
      tags:
      - Residency
      x-content-type: application/json
      x-accepts: application/json
      x-tags:
      - tag: Residency
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Invalid payload, missing fields, or conflicting regions."
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Policy or evidence ID not found.
    InternalError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Enforcement sidecar or evidence engine unavailable.
